services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin}; do sleep 2; done;
      mc mb --ignore-existing local/${MINIO_BUCKET:-mess-workspace};
      mc anonymous set download local/${MINIO_BUCKET:-mess-workspace};
      "

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8822}:8000"
    env_file:
      - .env
    environment:
      # В Docker MinIO доступен по имени сервиса, не localhost.
      MINIO_ENDPOINT: http://minio:9000
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-/mes/files}
    # Postgres на хосте / в LAN: в DATABASE_URL укажите IP сервера БД или host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # В проде оставьте пустым: браузер ходит на тот же origin, nginx проксирует /api.
        VITE_API_BASE: ${VITE_API_BASE:-}
    ports:
      - "${WEB_PORT:-8811}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Одноразовые скрипты (миграции данных, infer_employee_genders и т.д.):
  # docker compose --profile jobs run --rm api-job scripts/infer_employee_genders.py --write
  api-job:
    profiles: ["jobs"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: http://minio:9000
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["python"]
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  minio_data:
